<script type="text/javascript">
  RED.nodes.registerType("llama-cpp", {
    category: "AI",
    color: "#a0c8e0",
    defaults: {
      name:          { value: "" },
      // Mode API
      mode:          { value: "completion" },
      // Cluster
      clusterRole:   { value: "standalone" },
      rpcBinary:     { value: "rpc-server" },
      rpcHost:       { value: "0.0.0.0" },
      rpcPort:       { value: 50052, validate: RED.validators.number() },
      rpcDevice:     { value: "" },
      rpcWorkers:    { value: "" },
      // Model
      modelPath:     { value: "", required: true },
      llamaBinary:   { value: "llama-server" },
      alias:         { value: "" },
      // Server
      serverPort:    { value: 8080,      validate: RED.validators.number() },
      host:          { value: "127.0.0.1" },
      nSlots:        { value: 1,         validate: RED.validators.number() },
      contBatching:  { value: true },
      noMmap:        { value: false },
      mlock:         { value: false },
      noWarmup:      { value: false },
      flashAttn:     { value: false },
      // Context
      contextSize:   { value: 2048,  validate: RED.validators.number() },
      batchSize:     { value: 512,   validate: RED.validators.number() },
      ubatchSize:    { value: 512,   validate: RED.validators.number() },
      noCtxShift:    { value: false },
      // Threads
      threads:       { value: -1,    validate: RED.validators.number() },
      threadsBatch:  { value: -1,    validate: RED.validators.number() },
      // GPU
      ngl:           { value: 0,     validate: RED.validators.number() },
      splitMode:     { value: "" },
      mainGpu:       { value: "" },
      tensorSplit:   { value: "" },
      // Sampling
      temperature:   { value: 0.8 },
      maxTokens:     { value: 512,   validate: RED.validators.number() },
      topK:          { value: 40,    validate: RED.validators.number() },
      topP:          { value: 0.95 },
      minP:          { value: 0.05 },
      repeatPenalty: { value: 1.1 },
      repeatLastN:   { value: 64,    validate: RED.validators.number() },
      seed:          { value: -1,    validate: RED.validators.number() },
      mirostat:      { value: 0,     validate: RED.validators.number() },
      mirostatTau:   { value: 5.0 },
      mirostatEta:   { value: 0.1 },
      // Chat
      chatTemplate:  { value: "" },
      systemPrompt:  { value: "" },
      // Debug
      debugTrace:    { value: false }
    },
    inputs: 1,
    outputs: 2,
    icon: "font-awesome/fa-microchip",
    label: function () {
      const base = this.name || "llama.cpp";
      if (this.clusterRole === "master") return base + " [master]";
      if (this.clusterRole === "worker") return base + " [worker]";
      return base;
    },
    paletteLabel: "llama.cpp",
    oneditprepare: function () {
      function updateClusterVisibility() {
        const role = $("#node-input-clusterRole").val();
        // Tout ce qui concerne le modèle / API / sampling ne s'applique
        // qu'en standalone et master — un worker n'exécute pas d'inférence.
        $("#fields-standalone-master").toggle(role !== "worker");
        $("#fields-master-only").toggle(role === "master");
        $("#fields-worker-only").toggle(role === "worker");
      }
      $("#node-input-clusterRole").on("change", updateClusterVisibility);
      updateClusterVisibility();
    }
  });
</script>

<script type="text/html" data-help-name="llama-cpp">
  <p>Lance <b>llama-server</b> (llama.cpp) comme processus enfant et expose l'inférence LLM dans un flow Node-RED. Trois modes API, deux sorties, et un mode Cluster RPC pour distribuer un modèle sur plusieurs machines.</p>

  <!-- ═══════════════════════════════════════════════════ -->
  <h3>Rôle de cluster (RPC distribué)</h3>

  <h4>standalone <small>(défaut)</small></h4>
  <p>Comportement classique : un seul <code>llama-server</code>, tout tourne sur cette machine.</p>

  <h4>master</h4>
  <p>Charge le modèle localement et lance <code>llama-server</code> avec <code>--rpc host1:port1,host2:port2,...</code>
     pour distribuer les couches sur des workers distants. Le nœud continue de répondre via
     l'API HTTP normale (modes completion/openai/chat) — la distribution est transparente pour le flow.</p>
  <p><b>Important :</b> réglez <b>GPU layers</b> sur une valeur élevée (ex. <code>99</code>)
     pour que des couches soient effectivement déchargées vers les workers ; sinon le modèle
     tourne uniquement en local. Utilisez <b>Tensor split</b> pour contrôler manuellement
     la proportion de mémoire allouée à chaque device (local et distants).</p>

  <h4>worker</h4>
  <p>N'exécute aucune inférence. Lance <code>rpc-server</code>, qui expose le CPU/GPU de
     cette machine sur le réseau. Un nœud <b>master</b> ailleurs s'y connecte via son
     adresse <code>host:port</code>. Ce nœud ignore tout message d'entrée destiné à
     l'inférence (Modèle, Mode API, Sampling, Chat/Prompt n'ont aucun effet en Worker).</p>
  <p>⚠️ Le protocole RPC de llama.cpp est décrit par le projet comme expérimental et non
     sécurisé — à réserver à un réseau local de confiance, jamais exposé sur Internet.</p>

  <!-- ═══════════════════════════════════════════════════ -->
  <h3>Entrée</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string | object | array</span></dt>
    <dd>Prompt utilisateur, objet requête OpenAI complet, ou tableau <code>messages[]</code>
        selon le Mode API. Ignoré en rôle Worker.</dd>
  </dl>

  <h4>Messages de contrôle (tous rôles)</h4>
  <dl class="message-properties">
    <dt>topic = "debug"</dt>
    <dd>Émet la configuration complète (commande de spawn, arguments) sur la sortie 2.</dd>
    <dt>topic = "trace", payload = true/false</dt>
    <dd>Active/désactive à chaud l'affichage des logs du processus dans le panneau Debug.</dd>
  </dl>

  <!-- ═══════════════════════════════════════════════════ -->
  <h3>Sortie</h3>

  <h4>Sortie 1 — réponse LLM (standalone / master uniquement)</h4>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string</span></dt>
    <dd>Texte généré par le modèle.</dd>
    <dt>llamacpp <span class="property-type">object</span></dt>
    <dd>Réponse API complète (choices, usage, timings…).</dd>
    <dt>messages <span class="property-type">array</span></dt>
    <dd>Modes openai/chat : historique complet pour le tour suivant.</dd>
  </dl>

  <h4>Sortie 2 — debug / timing</h4>
  <dl class="message-properties">
    <dt>topic = "timing"</dt>
    <dd>Statistiques de performance (tokens/sec) après chaque inférence — standalone/master uniquement.</dd>
    <dt>topic = "debug"</dt>
    <dd>Config complète, adaptée au rôle (commande llama-server ou rpc-server).</dd>
  </dl>

  <h3>Exemple de topologie cluster</h3>
  <pre>
Machine A (Radxa, faible RAM) — nœud "master"
  Model path : /models/big-model.gguf
  RPC Workers :
    192.168.1.42:50052
    192.168.1.43:50052
  GPU layers : 99

Machine B — nœud "worker"          Machine C — nœud "worker"
  RPC Host : 0.0.0.0                 RPC Host : 0.0.0.0
  RPC Port : 50052                   RPC Port : 50052
  </pre>
  <p>Le modèle, trop gros pour tenir sur la Machine A seule, est réparti automatiquement
     entre les 3 machines selon leur mémoire disponible.</p>

  <h3>Notes générales</h3>
  <ul>
    <li>Chaque instance démarre son propre processus — utilise des ports différents pour plusieurs nœuds.</li>
    <li>Arrêt propre (SIGTERM puis SIGKILL) au redéploiement ou à la fermeture du flow.</li>
    <li><b>Threads -1</b> = détection automatique du nombre de cœurs.</li>
  </ul>
